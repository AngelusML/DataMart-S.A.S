# DataMart S.A.S. - Pipeline ETL con Apache Airflow + Data Warehouse en PostgreSQL
# Levantar todo con:  docker compose up -d
# Todas las credenciales vienen del archivo .env (ver .env.example)

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.5
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres-airflow:5432/${AIRFLOW_DB_NAME}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
    AIRFLOW__WEBSERVER__WORKERS: "2"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
  volumes:
    - ./dags:/opt/airflow/dags
    - ./data:/opt/airflow/data:ro
    - ./config:/opt/airflow/datamart_config:ro
    - ./scripts:/opt/airflow/scripts:ro
    - airflow-logs:/opt/airflow/logs
  depends_on: &airflow-common-depends-on
    postgres-airflow:
      condition: service_healthy
    postgres-dw:
      condition: service_healthy

services:
  # ---------- Base de datos de METADATOS de Airflow ----------
  postgres-airflow:
    image: postgres:16
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME}"]
      interval: 5s
      retries: 10
    restart: always

  # ---------- Repositorio ANALÍTICO (Data Warehouse) ----------
  postgres-dw:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DW_USER}
      POSTGRES_PASSWORD: ${DW_PASSWORD}
      POSTGRES_DB: ${DW_DB}
    ports:
      - "${DW_HOST_PORT:-5433}:5432"   # para conectarse desde DBeaver / psql en el host
    volumes:
      - dw-data:/var/lib/postgresql/data
      - ./sql/ddl:/docker-entrypoint-initdb.d:ro   # crea las tablas al iniciar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DW_USER} -d ${DW_DB}"]
      interval: 5s
      retries: 10
    restart: always

  # ---------- Inicialización: migra la BD, crea admin, Connections y Variables ----------
  airflow-init:
    <<: *airflow-common
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      DW_USER: ${DW_USER}
      DW_PASSWORD: ${DW_PASSWORD}
      DW_DB: ${DW_DB}
    command:
      - bash
      - -c
      - |
        set -e
        echo ">> Creando Airflow Connections"
        airflow connections delete dw_postgres || true
        airflow connections add dw_postgres \
          --conn-type postgres --conn-host postgres-dw --conn-port 5432 \
          --conn-login "$${DW_USER}" --conn-password "$${DW_PASSWORD}" --conn-schema "$${DW_DB}"
        airflow connections delete fs_datamart_raw || true
        airflow connections add fs_datamart_raw \
          --conn-type fs --conn-extra '{"path": "/opt/airflow/data/raw"}'
        echo ">> Importando Airflow Variables"
        airflow variables import /opt/airflow/datamart_config/airflow_variables.json
        echo ">> Inicialización completa"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-db-data:
  dw-data:
  airflow-logs:
